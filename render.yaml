databases:
  - name: kerak-postgres
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: kerak-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/server
    preDeployCommand: npx prisma migrate deploy --schema=apps/server/prisma/schema.prisma
    startCommand: npm run start --workspace=apps/server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kerak-postgres
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false

  - type: web
    name: kerak-web
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_BOT_USERNAME
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
